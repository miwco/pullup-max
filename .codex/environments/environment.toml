# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "pullup-max"

[setup]
script = "npm.cmd install"

[[actions]]
name = "Run"
icon = "run"
command = "npm.cmd run dev -- --host 127.0.0.1 --port 4173"

[[actions]]
name = "Stop"
icon = "tool"
command = '''
Get-CimInstance Win32_Process |
  Where-Object {
    $_.CommandLine -like '*vite*4173*' -and
    $_.CommandLine -like '*pullup-max*'
  } |
  ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
'''

[[actions]]
name = "Open in browser"
icon = "tool"
command = "Start-Process http://127.0.0.1:4173"
